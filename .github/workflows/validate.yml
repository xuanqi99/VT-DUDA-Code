name: Lightweight validation
on:
  push:
  pull_request:

jobs:
  source-and-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q diffusion UDA scripts tests
      - name: Test experiment planning
        run: python -m unittest discover -s tests -v
      - name: Check planner entry points
        run: |
          python scripts/generate_grid.py --help
          python scripts/train_uda_grid.py --help
